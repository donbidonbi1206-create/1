<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>切克斯語錄 Widget</title>
  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 0.5);
      --text-color: #222222;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    /* 適應 Notion 深色模式 (Dark Mode) */
    @media (prefers-color-scheme: dark) {
      :root {
        --card-bg: rgba(30, 30, 30, 0.75);
        --card-border: rgba(255, 255, 255, 0.15);
        --text-color: #f0f0f0;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .widget-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    /* 角色立繪 */
    .avatar {
      width: 150px;
      height: auto;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0px 4px 10px rgba(0, 0, 0, 0.25));
      z-index: 1;
    }

    /* 懸停與點擊的動態反饋 */
    .widget-container:hover .avatar {
      transform: scale(1.05);
    }
    .widget-container:active .avatar {
      transform: scale(0.95);
    }

    /* 點擊時角色的 Q 彈動畫類別 */
    .avatar.pop {
      animation: popAnim 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popAnim {
      0% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    /* 對話框樣式 */
    .quote-box {
      margin-top: -12px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      font-size: 12.5px;
      line-height: 1.45;
      color: var(--text-color);
      text-align: center;
      min-width: 160px;
      max-width: 240px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px var(--shadow);
      pointer-events: none;
      z-index: 2;
      box-sizing: border-box;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* 文字切換時的漸隱漸現 */
    .quote-box.fade {
      opacity: 0.3;
      transform: translateY(3px);
    }
  </style>
</head>
<body>

  <div class="widget-container" onclick="randomizeAll()">
    <!-- 預設直接顯示第一張角色圖 -->
    <img id="character" class="avatar" src="https://30mins.notion.site/image/attachment%3A69e8d81a-a9c0-46af-84d4-8f86938f6c5f%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(1).png?table=block&id=3ef4455a-9efb-80ea-89bb-e5119b39c269&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl" alt="切克斯">
    <div id="quote" class="quote-box">點擊切克斯，收聽廣播！</div>
  </div>

  <script>
    const images = [
      "https://30mins.notion.site/image/attachment%3A69e8d81a-a9c0-46af-84d4-8f86938f6c5f%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(1).png?table=block&id=3ef4455a-9efb-80ea-89bb-e5119b39c269&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3A227f267d-d7d5-48b1-b885-69521a8960f3%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(2).png?table=block&id=3ef4455a-9efb-8035-996b-f11eb880978a&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3A8bcd5c30-93d7-457c-ae7f-aeaa6fb31905%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(3).png?table=block&id=3ef4455a-9efb-8047-b257-c558db766ffd&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3A791d029b-dcf7-410b-9ca5-3422cd77de4c%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(4).png?table=block&id=3ef4455a-9efb-80d2-a3e7-db9f6d3abb90&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl",
      "https://30mins.notion.site/image/attachment%3Ad9703722-3916-48fc-8f3d-2aa52ef9bbf7%3A%E6%9C%AA%E5%91%BD%E5%90%8D%E7%9A%84%E4%BD%9C%E5%93%81_3_(5).png?table=block&id=3ef4455a-9efb-805b-a6c8-d5cfbf68b2ab&spaceId=9b94455a-9efb-8188-a968-00031966add7&width=2000&userId=&cache=v2&imgBuildSrc=requestProxiedImageUrl"
    ];

    const quotes = [
      "「得了，少說廢話，走吧！」",
      "「哈哈哈哈哈，老天，這也太搞笑了。」",
      "「ᯇᴗᯇ」",
      "「先歇一會兒，再往上衝吧👆」",
      "「鯊魚仔，你說——人類的飛行能力，究竟是被誰偷走的呢？」",
      "「下輩子我們也做兄弟吧。我們一定可以創造出屬於我們自己的《萊特兄弟》的故事。」",
      "「人類要是感到疼痛，也是可以大聲示弱的吧？這難道不是人類被發明出來時就設計好的機制嗎？」",
      "「如果我能活得更久一點，我也想去看看，什麼是愛。你說呢，鯊魚仔？」",
      "「昨天我從床底下挖出一本破字典，翻開一瞧，上面寫著『孤獨』——a-l-o-n-e。」",
      "「喔！路易！你做的這盤番茄炒蛋蓋飯可真是不賴！我想一口氣吃下一百萬份！」",
      "「等我哪天想起來那家飾品店到底藏在哪條街角，咱們就一起去挑幾對酷炫的耳環吧——」",
      "「完蛋，昨天忘了幫薇薇調整好防曬系統……看來等她下次飛回來，我的臉非得被她那條大紅尾巴狠狠賞上幾巴掌不可了！」",
      "「路易！別再睡懶覺啦！快爬起來看看我剛改裝完成的『垃圾桶機器人』！」",
      "「我和路易是全天下最厲害的搭檔，對吧？」"
    ];

    // 自動預載入所有圖片，防止閃爍
    window.onload = function() {
      images.forEach(src => {
        const img = new Image();
        img.src = src;
      });
    };

    let lastImgIndex = 0;
    let lastQuoteIndex = -1;

    function randomizeAll() {
      const charEl = document.getElementById("character");
      const quoteEl = document.getElementById("quote");

      // 觸發對話框淡出與圖片彈跳
      quoteEl.classList.add("fade");
      charEl.classList.remove("pop");
      void charEl.offsetWidth; // 強制重繪以重置 CSS 動畫
      charEl.classList.add("pop");

      let newImgIndex;
      let newQuoteIndex;

      do {
        newImgIndex = Math.floor(Math.random() * images.length);
      } while (newImgIndex === lastImgIndex && images.length > 1);

      do {
        newQuoteIndex = Math.floor(Math.random() * quotes.length);
      } while (newQuoteIndex === lastQuoteIndex && quotes.length > 1);

      lastImgIndex = newImgIndex;
      lastQuoteIndex = newQuoteIndex;

      setTimeout(() => {
        charEl.src = images[newImgIndex];
        quoteEl.innerText = quotes[newQuoteIndex];
        quoteEl.classList.remove("fade");
      }, 120);
    }
  </script>
</body>
</html>
